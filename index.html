<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweetflips - Higher or Lower</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="Sweetflips Logo" id="logo">
        <h1>Higher or Lower</h1>
        <button id="toggle-sound">Sound: On</button>
    </header>
    <main>
        <div class="balance">€<span id="balance">1000</span></div>
        <div class="card"><span id="number">?</span></div>
        <div class="controls">
            <button onclick="guess('lower')">Lager</button>
            <button onclick="guess('higher')">Hoger</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
